name: CI

# Runs the TypeScript suite (vitest). The native C indexer now lives in the
# separate ruevu/cortex-indexer repo (with its own CI matrix); cortex consumes
# its prebuilt binary, so there is no C build here. The TS suite runs ONLY when
# files it depends on change (see the `changes` job), so a docs-only PR skips it.
# A single always-running `ci-gate` job aggregates the result — make THAT the
# required status check (not ts-suite itself: it is path-skipped, and a skipped
# *required* check would otherwise block every docs-only merge).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Decide whether the TS suite needs to run, from the changed paths ──────
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so we can diff against the base
      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # Unknown / nonexistent base (first push, force-push, new branch) →
          # run the suite (safe default; never silently skip the gate).
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "ts=true" >> "$GITHUB_OUTPUT"
            echo "base unknown → running TS suite"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"; echo "$changed"
          ts=false
          echo "$changed" | grep -qE '^(src/|tests/|scripts/|package\.json$|package-lock\.json$|vitest\.config\.ts$|\.github/workflows/ci\.yml$)' && ts=true
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          echo "→ run TS=$ts"

  # ── TypeScript suite (vitest) ───────────────────────────────────────────
  ts-suite:
    name: TypeScript suite (vitest)
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Configure git identity (some tests create repos + commit)
        run: |
          git config --global user.email "ci@cortex.test"
          git config --global user.name "Cortex CI"

      - name: Install npm dependencies
        # postinstall runs scripts/fetch-indexer.mjs (downloads the prebuilt
        # cortex-indexer). It is intentionally soft-warn for end users, so the
        # next step makes the fetch GATING in CI.
        run: npm ci

      - name: Viewer bundle freshness (committed dist must match source)
        run: |
          npm run build:viewer
          git diff --exit-code -- src/viewer/dist \
            || { echo "::error::src/viewer/dist is stale — run 'npm run build:viewer' and commit"; exit 1; }
          test -z "$(git status --porcelain -- src/viewer/dist)" \
            || { echo "::error::untracked files under src/viewer/dist — commit the full build output"; exit 1; }

      - name: Viewer typecheck
        run: npx tsc -p src/viewer --noEmit

      - name: Fetch + verify the prebuilt indexer (gating in CI)
        # The MCP-contract tests exercise the real binary. postinstall may have
        # soft-warned; ensure the linux-x64 asset is actually present so CI runs
        # with full coverage instead of silently skipping binary-backed tests.
        run: |
          npm run fetch-indexer
          test -x bin/cortex-indexer || { echo "::error::cortex-indexer prebuilt not fetched"; exit 1; }
          ./bin/cortex-indexer --version

      - name: Run TypeScript test suite
        run: npm test

  # ── Required-check aggregator ────────────────────────────────────────────
  # Always runs (even when the suite is path-skipped) so it can safely be THE
  # required status check. Fails iff the suite that ran failed/was cancelled, or
  # the changes job errored. Mark this job ("CI gate") required in branch rules.
  ci-gate:
    name: CI gate
    needs: [changes, ts-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required suites
        run: |
          ch="${{ needs.changes.result }}"
          ts="${{ needs.ts-suite.result }}"
          echo "changes=$ch  ts-suite=$ts"
          if [ "$ch" != "success" ]; then
            echo "::error::changes job did not succeed ($ch)"; exit 1
          fi
          if [ "$ts" = "failure" ] || [ "$ts" = "cancelled" ]; then
            echo "::error::the TS suite did not pass"; exit 1
          fi
          echo "OK — the TS suite passed (a path-skipped suite is fine)"
