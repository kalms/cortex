name: CI

# Runs the native C indexer test suite and the TypeScript suite on every push to
# main and every PR. The C suite (`make -f Makefile.indexer test`) had silently
# rotted to 196 failures because nothing ran it; this workflow is the gate that
# keeps it honest. Make these two jobs required status checks in branch
# protection so a red suite blocks merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-suite:
    name: C indexer suite (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # clang: the toolchain the codebase is developed and shipped with;
          #   CI matches it rather than relying on the runner's default gcc,
          #   whose stricter -Werror flags differ (e.g. -Werror=nonnull).
          # build-essential: make + libstdc++ (LDFLAGS uses -lstdc++).
          # zlib1g-dev: -lz. libgit2-dev: optional fast git-history path
          #   (Makefile auto-detects via pkg-config; falls back to `git log`).
          sudo apt-get install -y clang build-essential pkg-config zlib1g-dev libgit2-dev

      - name: Configure git identity (integration tests clone + commit)
        run: |
          git config --global user.email "ci@cortex.test"
          git config --global user.name "Cortex CI"

      - name: Build + run C test suite (clang, asan + ubsan)
        working-directory: internal/indexer
        # Pin clang to match local/production builds. detect_leaks=0 keeps parity
        # with macOS asan (which has no LeakSanitizer); enabling LSan and gcc
        # portability is a tracked follow-up, not a release blocker.
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make -f Makefile.indexer CC=clang CXX=clang++ test

  ts-suite:
    name: TypeScript suite (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build dependencies
        # `npm ci` runs the postinstall hook (scripts/build-indexer.sh), which
        # compiles bin/cortex-indexer — the MCP-contract tests exercise it.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev libgit2-dev

      - name: Configure git identity (some tests create repos + commit)
        run: |
          git config --global user.email "ci@cortex.test"
          git config --global user.name "Cortex CI"

      - name: Install npm dependencies (builds the indexer via postinstall)
        run: npm ci

      - name: Run TypeScript test suite
        run: npm test
